site_name: bag3d-pipeline
site_url: https://3DBAG.github.io/3dbag-pipeline
repo_url: https://github.com/3DBAG/3dbag-pipeline
repo_name: 3DBAG/3dbag-pipeline

theme:
  name: material
  font:
    text: Roboto
  language: en
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - gen-files:
      scripts:
      - docs/gen_ref_pages_common.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/common/src]
          options:
            show_source: true
            docstring_style: google
            show_docstring_parameters: true
            show_docstring_returns: true
            show_docstring_examples: true
#  - navigation.instant
#  - navigation.tracking
#  - navigation.sections
#  - navigation.expand
#  - navigation.top
#  - navigation.indexes
#  - search.highlight
#  - search.suggest
#  - content.tabs.link

markdown_extensions:
  - admonition
  - markdown_include.include:
      base_path: docs
  - toc:
      permalink: true

nav:
  - Overview:
    - index.md
    - Source datasets: source_datasets.md
    - Data flow: data_flow.md
  - Development: development/
  - Deployment: deployment/
  - Production: production.md
  - Packages:
    - common: index_common.md
    - core: index_core.md
    - floors_estimation: index_floors_estimation.md
    - party_walls: index_party_walls.md
  - Architecture Decisions:
    - adr/0001-ahn-checksum-automation-strategy.md
    - adr/0002-independent-package-environments.md
    - adr/0003-building-surfaces-performance.md
    - adr/0004-cjindex-stage-interface-and-cityjsonseq.md
    - adr/0005-manifest-owned-versioning.md
  - API Reference: reference/
