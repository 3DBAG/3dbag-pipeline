name: Release
description: Create a new release for the 3dbag-pipeline with the specified version, use the release notes from the CHANGELOG.md file and create a pull request to merge the changes back to the develop branch.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    branches:
      - master

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Configure Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Validate and synchronize manifest version
        id: manifest
        run: |
          python3 scripts/manifest_versions.py sync
          python3 scripts/manifest_versions.py check
          echo "VERSION=$(python3 scripts/manifest_versions.py value pipeline)" >> $GITHUB_OUTPUT
          if ! git diff --quiet -- pyproject.toml uv.lock packages; then
            git add pyproject.toml uv.lock packages/*/pyproject.toml packages/*/uv.lock
            git commit -m "sync version metadata"
            git push origin master
          fi
          git tag "v$(python3 scripts/manifest_versions.py value pipeline)"
          git push origin "v$(python3 scripts/manifest_versions.py value pipeline)"

      - name: Parse Changelog
        run: |
          python .github/scripts/parse_changelog.py ${{ steps.manifest.outputs.VERSION }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.manifest.outputs.VERSION }}
          name: 3DBAG ${{ steps.manifest.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false

      - name: Create Pull Request to develop
        uses: peter-evans/create-pull-request@v7
        with:
          branch: master
          base: develop
          title: 'Merge release ${{ steps.manifest.outputs.VERSION }} back to develop'
          body: |
            This PR merges the changes from release ${{ steps.manifest.outputs.VERSION }} back to the develop branch.

            Changes included in this release:

            $(cat RELEASE_NOTES.md)
          labels: |
            release
            automated pr
