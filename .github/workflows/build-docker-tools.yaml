name: Build and Publish The Tools Docker Image

on:
  push:
    tags:
      - "*"
    branches:
      - "develop"
      - "pc-*"
    paths:
      - docker/tools/Dockerfile
      - tools-build.sh
      - tools-test.sh
      - 3dbag-manifest.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set docker image tag
        run: echo "DOCKER_TAG=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
      - name: Read tool versions from manifest
        id: manifest
        run: |
          build_args=$(python3 -c "
          import json
          manifest = json.load(open('3dbag-manifest.json'))
          tools = manifest['tools']
          mapping = {
              'uv': 'UV_VERSION',
              'gdal': 'GDAL_VERSION',
              'proj': 'PROJ_VERSION',
              'geos': 'GEOS_VERSION',
              'geotiff': 'GEOTIFF_VERSION',
              'lastools': 'LASTOOLS_VERSION',
              'pdal': 'PDAL_VERSION',
              'val3dity': 'VAL3DITY_VERSION',
              'cjio': 'CJIO_VERSION',
              'tyler': 'TYLER_VERSION',
              'tyler-multiformat': 'TYLER_MULTIFORMAT_VERSION',
              'tyler-db': 'TYLER_DB_VERSION',
              'roofer': 'ROOFER_VERSION',
              'geoflow-bundle': 'GEOFLOW_BUNDLE_VERSION',
              'cjval': 'CJVAL_VERSION',
          }
          for tool, arg in mapping.items():
              print(f'{arg}={tools[tool][\"version\"]}')
          ")
          {
            echo 'BUILD_ARGS<<EOF'
            echo "$build_args"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/tools/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ env.DOCKER_TAG }}
            ${{ steps.manifest.outputs.BUILD_ARGS }}
          push: true
          tags: 3dgi/3dbag-pipeline-tools:${{ env.DOCKER_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
