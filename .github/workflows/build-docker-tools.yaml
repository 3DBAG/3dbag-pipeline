name: Build and Publish The Tools Docker Image

on:
  push:
    tags:
      - "*"
    branches:
      - "develop"
      - "pc-*"
    paths:
      - docker/tools/Dockerfile
      - tools-build.sh
      - tools-test.sh
      - 3dbag-manifest.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Read tool versions from manifest
        id: manifest
        run: |
          python3 scripts/manifest_versions.py validate
          {
            echo 'BUILD_ARGS<<EOF'
            python3 scripts/manifest_versions.py build-args
            echo 'EOF'
            echo "IMAGE_TAG=$(python3 scripts/manifest_versions.py value tools)"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/tools/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.IMAGE_TAG }}
            ${{ steps.manifest.outputs.BUILD_ARGS }}
          push: true
          tags: 3dgi/3dbag-pipeline-tools:${{ steps.manifest.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
