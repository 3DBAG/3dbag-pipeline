name: Build and Publish The Tools Docker Image

on:
  push:
    branches:
      - "develop"
    paths:
      - docker/tools/**
      - tools-build.sh
      - tools-test.sh
      - 3dbag-manifest.json
      - scripts/manifest_versions.py
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Read tools image values from manifest
        id: manifest
        run: |
          python3 scripts/manifest_versions.py check
          {
            echo 'BUILD_ARGS<<EOF'
            python3 scripts/manifest_versions.py build-args
            echo 'EOF'
            while IFS='=' read -r name value; do
              echo "${name}=${value}"
            done < <(python3 scripts/manifest_versions.py env --format build-args)
            echo "TOOLS_VERSION=$(python3 scripts/manifest_versions.py value tools)"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/tools/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.TOOLS_VERSION }}
            ${{ steps.manifest.outputs.BUILD_ARGS }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
