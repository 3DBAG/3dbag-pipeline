name: Build and Publish Docker Images

on:
  push:
    tags:
      - 'v202[2-9].[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Read and verify release version from manifest
        id: manifest
        run: |
          python3 scripts/manifest_versions.py validate
          version=$(python3 scripts/manifest_versions.py value pipeline)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          {
            echo "VERSION=${version}"
            echo "TOOLS_IMAGE=$(python3 scripts/manifest_versions.py env --format build-args | awk -F= '/^BAG3D_TOOLS_IMAGE=/{print $2}')"
          } >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push core
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/pipeline/bag3d-core.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.TOOLS_IMAGE }}
          push: true
          tags: 3dgi/3dbag-pipeline-core:${{ steps.manifest.outputs.VERSION }}
      - name: Build and push floors estimation
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/pipeline/bag3d-floors-estimation.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.TOOLS_IMAGE }}
          push: true
          tags: 3dgi/3dbag-pipeline-floors-estimation:${{ steps.manifest.outputs.VERSION }}
      - name: Build and push party walls
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/pipeline/bag3d-party-walls.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.TOOLS_IMAGE }}
          push: true
          tags: 3dgi/3dbag-pipeline-party-walls:${{ steps.manifest.outputs.VERSION }}
      - name: Build and push export
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./docker/pipeline/bag3d-export.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.TOOLS_IMAGE }}
          push: true
          tags: 3dgi/3dbag-pipeline-export:${{ steps.manifest.outputs.VERSION }}
      - name: Build and push dagster
        uses: docker/build-push-action@v6
        with:
          context: ./docker/dagster
          file: ./docker/dagster/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.VERSION }}
          push: true
          tags: 3dgi/3dbag-pipeline-dagster:${{ steps.manifest.outputs.VERSION }}
