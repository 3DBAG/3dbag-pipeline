# Validate Python and workflows on every PR and branch push, including docs changes.
name: Lint
on:
  pull_request:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, master]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Check Python
        run: |
          make lint
      - name: Validate workflows
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.7
          archive="actionlint_${version}_linux_amd64.tar.gz"
          stage=$(mktemp -d)
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" -o "$stage/$archive"
          curl --fail --silent --show-error --location "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" -o "$stage/checksums.txt"
          (cd "$stage" && grep "  ${archive}$" checksums.txt | sha256sum --check -)
          tar -xzf "$stage/$archive" -C "$stage" actionlint
          "$stage/actionlint" -color
