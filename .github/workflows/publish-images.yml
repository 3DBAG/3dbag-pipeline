# Publish all seven images on release tag pushes; require tag and manifest version agreement before publication.
name: Publish Images Packages

on:
  push:
    tags:
      - 'v202[2-9].[0-9]+.[0-9]+'

permissions:
  contents: read
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  build:
    name: Publish seven pipeline images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Read and verify release values from manifest
        id: manifest
        run: |
          python3 scripts/manifest_versions.py check
          version=$(python3 scripts/manifest_versions.py value pipeline)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          {
            while IFS='=' read -r name value; do
              echo "${name}=${value}"
            done < <(python3 scripts/manifest_versions.py env --format build-args)
          } >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and push core
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-core.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_CORE_IMAGE }}
      - name: Build and push floors estimation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-floors-estimation.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_FLOORS_ESTIMATION_IMAGE }}
      - name: Build and push party walls
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-party-walls.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_PARTY_WALLS_IMAGE }}
      - name: Build and push terrain
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-terrain.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_TERRAIN_IMAGE }}
      - name: Build and push underpasses
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-underpasses.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_UNDERPASSES_IMAGE }}
      - name: Build and push export
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/pipeline/bag3d-export.dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
            TOOLS_IMAGE=${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_EXPORT_IMAGE }}
      - name: Build and push dagster
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./docker/dagster
          file: ./docker/dagster/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.BAG3D_PIPELINE_VERSION }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_DAGSTER_IMAGE }}
