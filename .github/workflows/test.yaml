name: Test

on:
  pull_request:
    branches: [ "develop", "master" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
#  push:
#    branches: [ "develop", "master" ]
#    paths-ignore:
#      - "docs/**"
#      - "**.md"

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - run: |
        touch .env
        echo BAG3D_TEST_DATA=${PWD}/tests/test_data >> .env
    - name: Build docker images
      run: |
        make download
        make docker_volume_create
    - name: Start containers
      run: make docker_up
      continue-on-error: true
    - name: Print PostgreSQL logs if unhealthy
      if: failure()
      run: |
        docker compose -p $COMPOSE_PROJECT_NAME logs data-postgresql || true
        docker compose -p $COMPOSE_PROJECT_NAME logs dagster-postgresql || true
    - name: Run unit tests
      run: make test
    - name: Recreate volumes
      run: |
        make docker_down
        make docker_volume_recreate
        make docker_up_nobuild
    - name: Run integration tests
      run: make test_integration