name: Test

on:
  pull_request:
    branches: [ "develop", "master" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
#  push:
#    branches: [ "develop", "master" ]
#    paths-ignore:
#      - "docs/**"
#      - "**.md"

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Run tests
      run: make test
