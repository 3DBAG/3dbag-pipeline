name: Test

on:
  pull_request:
    branches: [ "develop", "master" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
#  push:
#    branches: [ "develop", "master" ]
#    paths-ignore:
#      - "docs/**"
#      - "**.md"

permissions:
  pull-requests: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    - name: Run tests with coverage
      run: make test_coverage
    - name: Generate coverage JSON
      if: always()
      run: |
        for pkg in common core export floors_estimation party_walls; do
          uv --project packages/$pkg run coverage json \
            --data-file=.coverage.$pkg -o .coverage.$pkg.json
        done
    - name: Generate Markdown summary
      if: always()
      run: python3 scripts/coverage_report_md.py > coverage-report.md
    - name: Add to job summary
      if: always()
      run: cat coverage-report.md >> $GITHUB_STEP_SUMMARY
    - name: Post PR comment
      if: always() && github.event_name == 'pull_request'
      uses: peter-evans/create-or-update-comment@v4
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body-path: coverage-report.md
        comment-tag: coverage-report
