# Publish changed tools inputs from develop or manually; tags are immutable and digest PRs use a dedicated automation token for unattended CI.
name: Publish tools

on:
  push:
    branches:
      - "develop"
    paths:
      - docker/tools/**
      - tools-build.sh
      - tools-test.sh
      - 3dbag-manifest.json
      - scripts/manifest_versions.py
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tools-image-publish-develop
  cancel-in-progress: false

jobs:
  prepare:
    name: Check tools inputs
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.publish-check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Check whether a new tools image is required
        id: publish-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=$(python3 scripts/manifest_versions.py tools-image-publish-required "$BASE_REVISION")
          echo "should_publish=$required" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Publish tools image
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.manifest.outputs.TOOLS_VERSION }}
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Read tools image values from manifest
        id: manifest
        run: |
          python3 scripts/manifest_versions.py check
          {
            echo 'BUILD_ARGS<<EOF'
            python3 scripts/manifest_versions.py build-args
            echo 'EOF'
            while IFS='=' read -r name value; do
              echo "${name}=${value}"
            done < <(python3 scripts/manifest_versions.py env --format build-args)
            echo "TOOLS_VERSION=$(python3 scripts/manifest_versions.py value tools)"
          } >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Require an unused tools image tag
        env:
          TOOLS_IMAGE_TAG: ${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE_TAG }}
        run: |
          error_log=$(mktemp)
          if docker buildx imagetools inspect "$TOOLS_IMAGE_TAG" > /dev/null 2> "$error_log"; then
            echo "Refusing to overwrite published tools image tag: $TOOLS_IMAGE_TAG" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|name unknown' "$error_log"; then
            cat "$error_log" >&2
            exit 1
          fi
      - name: Build and push tools image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ./
          file: ./docker/tools/Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            JOBS=2
            VERSION=${{ steps.manifest.outputs.TOOLS_VERSION }}
            ${{ steps.manifest.outputs.BUILD_ARGS }}
          push: true
          tags: ${{ steps.manifest.outputs.BAG3D_TOOLS_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  record-digest:
    name: Record tools digest PR
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - name: Record the published tools image digest
        env:
          TOOLS_DIGEST: ${{ needs.build-and-publish.outputs.digest }}
          TOOLS_VERSION: ${{ needs.build-and-publish.outputs.version }}
          GH_TOKEN: ${{ secrets.PIPELINE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'Configure PIPELINE_AUTOMATION_TOKEN (Contents and Pull requests write).' >&2; exit 1; }
          # Use the automation credential for branch pushes as well as PR operations.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh auth setup-git
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git fetch origin develop
          git checkout -B digest-base origin/develop
          python3 scripts/manifest_versions.py set-tools-image-digest "$TOOLS_DIGEST" --expected-version "$TOOLS_VERSION"
          python3 scripts/manifest_versions.py check
          if git diff --quiet -- 3dbag-manifest.json; then
            echo 'Matching tools digest already recorded.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="tools-image-digest-${TOOLS_VERSION}"
          remote_branch=$(git ls-remote --heads origin "$branch")
          if test -n "$remote_branch"; then
            git fetch origin "$branch"
            # Reuse only a branch with exactly the intended manifest change.
            git diff --exit-code origin/develop...FETCH_HEAD -- . ':!3dbag-manifest.json'
            git show FETCH_HEAD:3dbag-manifest.json > "$RUNNER_TEMP/digest-manifest.json"
            cmp 3dbag-manifest.json "$RUNNER_TEMP/digest-manifest.json"
            git restore 3dbag-manifest.json
            git checkout -B "$branch" FETCH_HEAD
          else
            git checkout -b "$branch"
            git add 3dbag-manifest.json
            git commit -m "pin tools image ${TOOLS_VERSION}"
            git push origin "$branch"
          fi
          pr=$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // empty')
          if test -z "$pr"; then
            printf 'Automated digest pin for tools image %s: %s.\n' "$TOOLS_VERSION" "$TOOLS_DIGEST" > "$RUNNER_TEMP/tools-pr.md"
            pr=$(gh pr create --base develop --head "$branch" \
              --title "pin tools image ${TOOLS_VERSION}" --body-file "$RUNNER_TEMP/tools-pr.md")
          fi
          gh pr merge "$pr" --auto --squash
