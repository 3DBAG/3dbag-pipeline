[project]
name = "3dbag-pipeline"
version = "2025.11.18"
description = "Development requirements of the 3DBAG pipeline"
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
docs = [
    "markdown-include>=0.8.1",
    "mkdocs-material>=9.5.48",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.1",
    "mkdocs-section-index>=0.3.9",
    "mkdocstrings[python]>=1.0.3",
]
lint = [
    "ruff~=0.15.1",
    "pyright>=1.1",
]
dev = [
    "dagster~=1.12.14",
    "dagster-webserver~=1.12.14",
    "bumpver~=2025.1131",
    "rich<14",  # rich 14.x introduced a regression in box.py causing ValueError on import
]

[tool.uv]
default-groups = ["dev", "docs", "lint"]

[tool.ruff]
include = ["packages/*/pyproject.toml", "scripts/*/*.py"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[tool.pyright]
typeCheckingMode = "standard"
include = ["packages"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.tox",
    ".git",
    "**/.venv*",
    "**/build",
    "**/docs",
    "**/site",
]
pythonVersion = "3.11"
reportPrivateImportUsage = false
reportUnnecessaryTypeIgnoreComment = "warning"

[tool.bumpver]
current_version = "2025.11.18"
version_pattern = "YYYY.0M.0D"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
pre_commit_hook = ".github/hooks/pre-commit"
post_commit_hook = ""
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"packages/common/pyproject.toml" = [
    'version = "{version}"',
]
"packages/core/pyproject.toml" = [
    'version = "{version}"',
]
"packages/floors_estimation/pyproject.toml" = [
    'version = "{version}"',
]
"packages/party_walls/pyproject.toml" = [
    'version = "{version}"',
]
