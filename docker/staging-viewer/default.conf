server {
    listen 8080;
    root /usr/share/nginx/html;
    location /export/ {
        alias /pipeline/stages/export/${RELEASE_VERSION}/;
        # Serve .city.json from the existing .city.json.gz with browser decoding.
        gzip_static on;
        disable_symlinks on;
        add_header Cache-Control "no-cache";
    }
    location = /index/tile_index.fgb {
        alias /index/${RELEASE_VERSION}.fgb;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
