[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bag3d-terrain"
version = "2026.07.29"
description = "Netherlands AHN terrain tiles for the 3DBAG viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bag3d-common",
    "dagster~=1.13.15",
    "dagster-postgres~=0.29.15",
    "imagecodecs>=2025.3.30",
    "mercantile~=1.2.1",
    "numpy>=2.2.6,<3",
    "pillow>=12.3.0",
    "pmtiles==3.4.1",
    "pyproj>=3.7.1,<4",
    "rasterio>=1.4.3,<2",
    "requests>=2.33.0",
    "scipy>=1.15.3,<2",
    "SQLAlchemy<2.1",  # Keep Dagster storage on the compatible psycopg2 default driver.
    "certifi>=2026.10.19",
    "urllib3>=2.8.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "coverage~=7.13.4", "pyright>=1.1", "dagster-dg-cli~=1.13.15", "dagster-webserver~=1.13.15", "ruff~=0.15.1"]

[tool.uv.sources]
bag3d-common = { path = "../common", editable = true }

[tool.setuptools.package-data]
"bag3d.terrain" = ["data/*", "_mapterhorn/LICENSE"]
"bag3d.terrain.defs" = ["terrain/*.yaml"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bag3d.terrain"
defs_module = "bag3d.terrain.defs"
registry_modules = [
    "bag3d.terrain.components.terrain_component",
]

[tool.ruff]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "tests"]
# Keep the imported numerical code intact rather than rewriting it for third-party stubs.
ignore = ["src/bag3d/terrain/_mapterhorn"]
venvPath = "."
venv = ".venv"
reportPrivateImportUsage = false

[tool.pytest.ini_options]
markers = ["integration: uses local GDAL executables and real transformation grids"]
