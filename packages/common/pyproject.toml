[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bag3d-common"
version = "2026.07.29"
description = "Resources, functions and type definitions that are used by the 3D BAG packages that define the data processing workflows."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Balázs Dukai", email = "balazs.dukai@3dgi.nl" },
    { name = "Ravi Peters", email = "ravi.peters@3dgi.nl" },
    { name = "Gina Stavropoulou", email = "G.Stavropoulou@tudelft.nl" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: Apache Software License"
]
urls = { github = "https://github.com/3DBAG/3dbag-pipeline" }
dependencies = [
    "dagster~=1.13.15",
    "certifi==2026.7.22",
    "docker~=7.2.0",
    "requests==2.34.2",
    "pgutils",
    "psycopg[binary]~=3.3.2",
    "bag3d-specs",
    "fabric~=3.2.2",
    "cityjson-index==0.11.0",
    "cityjson-lib==0.11.0",
]

[tool.uv]
constraint-dependencies = ["mako>=1.3.12"]

[dependency-groups]
dev = [
    "coverage~=7.13.4",
    "pytest~=9.0.2",
    "pyright>=1.1",
]

[tool.ruff]
# Need this block here so that ruff includes this package's files. The ruff config is in the root pyproject.toml file.

[tool.uv.sources]
pgutils = { git = "https://github.com/balazsdukai/pgutils.git", rev = "2026.1017" }
bag3d-specs = { git = "https://github.com/3DBAG/3dbag-specs.git", rev = "2025.09.03" }

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*is not a Python type.*:UserWarning",
    "ignore:.*Accessing the 'model_fields' attribute on the instance is deprecated.*:DeprecationWarning",
    "ignore:The `__fields__` attribute is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:.*UnresolvedAssetJobDefinition.*:UserWarning",
    "ignore:.*data_version.*beta.*:dagster_shared.utils.warnings.BetaWarning",
]
